name: Factory CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - 'task/**'
      - 'release/**'

permissions:
  contents: read

jobs:
  factory-docs:
    name: factory-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate Factory documentation
        run: python tools/validate_factory.py

  factory-gate-tests:
    name: factory-gate-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Test Factory gate and branch record evaluators
        run: python -m unittest discover -s tools -p 'test_factory*.py' -v
